<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActionAgad - Mamburao Emergency Response</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <!-- App Header/Logo Area -->
        <header class="app-header">
            <div class="logo-icon">🚨</div>
            <h1>ActionAgad</h1>
            <p class="tagline">Mamburao Emergency Response Portal</p>
        </header>

        <!-- Login Form -->
        <form class="login-form">
            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" placeholder="e.g., 09123456789" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <!-- Quick Emergency Access (Crucial for an emergency app) -->
        <div class="emergency-bypass">
            <p>Immediate Life-Threatening Emergency?</p>
            <button class="btn-emergency">🚨 Quick SOS Report</button>
        </div>

        <!-- Footer Links -->
        <footer class="login-footer">
            <p>Don't have an account? <a href="#">Register Here</a></p>
            <p class="mdrrmo-text">In partnership with Mamburao MDRRMO</p>
        </footer>
    </div>
</body>
</html>
