<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Emergency Response Dashboard</title>
    <link rel="stylesheet" href="password_reset.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <!-- Brand / Header Section -->
        <div class="login-header">
            <div class="brand-logo">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your email or phone to receive reset instructions</p>
        </div>

        <!-- Forgot Password Form Card -->
        <div class="login-card">
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="recovery-contact">Email or Mobile Number</label>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" id="recovery-contact" placeholder="Enter registered email or mobile" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>
        </div>

        <!-- Footer / Back to Login Link -->
        <div class="login-footer">
            <p>Remembered your password? <a href="index.html">Back to Sign in</a></p>
        </div>
    </div>

</body>
</html>
