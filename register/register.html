<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Emergency Response Dashboard</title>
    <link rel="stylesheet" href="register.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <!-- Brand / Header Section -->
        <div class="login-header">
            <div class="brand-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Create Account</h1>
            <p>Sign up to access emergency services</p>
        </div>

        <!-- Register Form Card -->
        <div class="login-card">
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email or Mobile Number</label>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" id="email" placeholder="Enter your email or mobile" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me terms-label">
                        <input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                </div>

                <button type="submit" class="login-btn">Create Account</button>
            </form>
        </div>

        <!-- Footer / Login Link -->
        <div class="login-footer">
            <p>Already have an account? <a href="index.html">Sign in</a></p>
        </div>
    </div>

</body>
</html>
