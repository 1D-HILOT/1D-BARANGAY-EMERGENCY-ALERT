<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACTIONAGAD Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900">

<!-- Header -->
<header class="bg-gradient-to-r from-red-700 to-red-950 text-white shadow-lg">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-4">
    <div class="flex items-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-white bg-red-800">
        <svg viewBox="0 0 100 100" class="h-8 w-8" fill="none" role="img" aria-label="ACTIONAGAD logo">
          <path d="M50 5 L88 20 V47 C88 70 72 87 50 97 C28 87 12 70 12 47 V20 Z" fill="white"/>
          <path d="M56 17 L31 53 H47 L41 79 L70 41 H53 Z" fill="#b91c1c"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-wide">ACTIONAGAD</h1>
        <p class="text-xs text-red-100">Responder Dashboard</p>
      </div>
    </div>
    <div class="text-right text-xs text-red-100">
      <div id="clock" class="text-base font-semibold text-white"></div>
      <div id="date"></div>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl space-y-6 px-4 py-6">

  <!-- Stats -->
  <section class="grid grid-cols-2 gap-4 lg:grid-cols-4" aria-label="Summary">
    <div class="rounded-xl border-l-4 border-red-600 bg-white p-4 shadow">
      <p class="text-sm text-gray-500">New alerts</p>
      <p id="statNew" class="text-3xl font-extrabold text-red-600">0</p>
    </div>
    <div class="rounded-xl border-l-4 border-amber-500 bg-white p-4 shadow">
      <p class="text-sm text-gray-500">Responders on the way</p>
      <p id="statDispatched" class="text-3xl font-extrabold text-amber-600">0</p>
    </div>
    <div class="rounded-xl border-l-4 border-green-600 bg-white p-4 shadow">
      <p class="text-sm text-gray-500">Resolved today</p>
      <p id="statResolved" class="text-3xl font-extrabold text-green-700">0</p>
    </div>
    <div class="rounded-xl border-l-4 border-gray-800 bg-white p-4 shadow">
      <p class="text-sm text-gray-500">Avg. response time</p>
      <p id="statAvg" class="text-3xl font-extrabold">–</p>
    </div>
  </section>

  <div class="grid gap-6 lg:grid-cols-3">

    <!-- Reports -->
    <section class="lg:col-span-2" aria-label="Reports">
      <div class="mb-3 flex flex-wrap items-center gap-2">
        <h2 class="mr-auto text-lg font-bold">Incoming reports</h2>
        <select id="fStatus" class="rounded-lg border border-gray-300 bg-white p-2 text-sm focus:border-red-600 focus:outline-none focus:ring-2 focus:ring-red-200">
          <option value="all">All statuses</option>
          <option value="new">New</option>
          <option value="dispatched">Dispatched</option>
          <option value="resolved">Resolved</option>
        </select>
        <select id="fType" class="rounded-lg border border-gray-300 bg-white p-2 text-sm focus:border-red-600 focus:outline-none focus:ring-2 focus:ring-red-200">
          <option value="all">All types</option>
          <option value="medical">Medical</option>
          <option value="fire">Fire</option>
          <option value="crime">Crime / Safety</option>
          <option value="disaster">Flood / Disaster</option>
        </select>
        <select id="fBrgy" class="rounded-lg border border-gray-300 bg-white p-2 text-sm focus:border-red-600 focus:outline-none focus:ring-2 focus:ring-red-200">
          <option value="all">All barangays</option>
        </select>
      </div>
      <ul id="list" class="space-y-3"></ul>
      <p id="empty" class="hidden rounded-xl bg-white p-8 text-center text-gray-500 shadow">No reports match these filters.</p>
    </section>

    <!-- Side panel -->
    <aside class="space-y-6">
      <section class="rounded-xl bg-white p-5 shadow" aria-label="Reports by type">
        <h2 class="mb-4 text-lg font-bold">Reports by type</h2>
        <div id="byType" class="space-y-3"></div>
      </section>
      <section class="rounded-xl bg-white p-5 shadow" aria-label="Reports by barangay">
        <h2 class="mb-4 text-lg font-bold">Busiest barangays</h2>
        <ol id="byBrgy" class="space-y-2 text-sm"></ol>
      </section>
      <a href="tel:911" class="block rounded-xl bg-gray-900 p-4 text-center font-semibold text-white shadow transition hover:bg-black">
        Call 911 dispatch
      </a>
    </aside>
  </div>
</main>

<footer class="pb-8 text-center text-sm text-gray-500">&copy; 2026 ACTIONAGAD. All rights reserved.</footer>

<script>
const TYPES = {
  medical:  { label: 'Medical',          icon: '🚑', bar: 'bg-red-600' },
  fire:     { label: 'Fire',             icon: '🔥', bar: 'bg-orange-500' },
  crime:    { label: 'Crime / Safety',   icon: '🚨', bar: 'bg-blue-600' },
  disaster: { label: 'Flood / Disaster', icon: '🌊', bar: 'bg-teal-600' }
};
const STATUS = {
  new:        { label: 'New',        cls: 'bg-red-100 text-red-700' },
  dispatched: { label: 'Dispatched', cls: 'bg-amber-100 text-amber-800' },
  resolved:   { label: 'Resolved',   cls: 'bg-green-100 text-green-800' }
};
const BRGYS = Array.from({ length: 9 }, (_, i) => 'Barangay ' + (i + 1));
const ago = m => Date.now() - m * 60000;

// Sample data. Replace with: fetch('/api/reports').then(r => r.json())
let reports = [
  { id: 1, type: 'fire',     brgy: 'Barangay 3', where: 'Purok 4, beside the sari-sari store', phone: '0917 123 4567', at: ago(2),   status: 'new' },
  { id: 2, type: 'medical',  brgy: 'Barangay 1', where: 'Main road near the chapel',          phone: '0918 222 3344', at: ago(6),   status: 'new' },
  { id: 3, type: 'disaster', brgy: 'Barangay 6', where: 'Creekside, Purok 1',                 phone: '0920 555 8899', at: ago(14),  status: 'dispatched', respondedAt: ago(9) },
  { id: 4, type: 'crime',    brgy: 'Barangay 5', where: 'Covered court',                      phone: '0905 777 1212', at: ago(25),  status: 'dispatched', respondedAt: ago(20) },
  { id: 5, type: 'medical',  brgy: 'Barangay 8', where: 'Fatima Subdivision, Block 2',        phone: '0919 888 4321', at: ago(70),  status: 'resolved', respondedAt: ago(64) },
  { id: 6, type: 'fire',     brgy: 'Barangay 3', where: 'Near the elementary school',         phone: '0927 101 2020', at: ago(130), status: 'resolved', respondedAt: ago(121) },
  { id: 7, type: 'disaster', brgy: 'Barangay 9', where: 'Riverbank, Purok 5',                 phone: '0933 456 7890', at: ago(180), status: 'resolved', respondedAt: ago(171) }
];

const $ = id => document.getElementById(id);
const fS = $('fStatus'), fT = $('fType'), fB = $('fBrgy');
BRGYS.forEach(b => fB.add(new Option(b, b)));

function timeAgo(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 1 ? 'Just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' hr ago';
}

function setStatus(id, status) {
  const r = reports.find(x => x.id === id);
  r.status = status;
  if (status === 'dispatched') r.respondedAt = Date.now();
  // TODO: persist with fetch('/api/reports/' + id, { method: 'PATCH', body: JSON.stringify({ status }) })
  render();
}

function render() {
  // Stats
  const count = s => reports.filter(r => r.status === s).length;
  $('statNew').textContent = count('new');
  $('statDispatched').textContent = count('dispatched');
  $('statResolved').textContent = count('resolved');
  const times = reports.filter(r => r.respondedAt).map(r => (r.respondedAt - r.at) / 60000);
  $('statAvg').textContent = times.length ? Math.round(times.reduce((a, b) => a + b) / times.length) + ' min' : '–';

  // Side panels
  const max = Math.max(1, ...Object.keys(TYPES).map(k => reports.filter(r => r.type === k).length));
  $('byType').innerHTML = Object.entries(TYPES).map(([k, t]) => {
    const n = reports.filter(r => r.type === k).length;
    return `<div><div class="mb-1 flex justify-between text-sm"><span>${t.icon} ${t.label}</span><span class="font-semibold">${n}</span></div>
      <div class="h-2 rounded-full bg-gray-100"><div class="h-2 rounded-full ${t.bar}" style="width:${(n / max) * 100}%"></div></div></div>`;
  }).join('');
  const top = BRGYS.map(b => [b, reports.filter(r => r.brgy === b).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('byBrgy').innerHTML = top.map(([b, n]) =>
    `<li class="flex justify-between rounded-lg bg-gray-50 px-3 py-2"><span>${b}</span><span class="font-semibold">${n}</span></li>`).join('');

  // List: active first, then newest
  const order = { new: 0, dispatched: 1, resolved: 2 };
  const rows = reports
    .filter(r => (fS.value === 'all' || r.status === fS.value) && (fT.value === 'all' || r.type === fT.value) && (fB.value === 'all' || r.brgy === fB.value))
    .sort((a, b) => order[a.status] - order[b.status] || b.at - a.at);
  $('empty').classList.toggle('hidden', rows.length > 0);
  $('list').innerHTML = rows.map(r => {
    const t = TYPES[r.type], s = STATUS[r.status];
    const action = r.status === 'new'
      ? `<button onclick="setStatus(${r.id},'dispatched')" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-200">Dispatch</button>`
      : r.status === 'dispatched'
      ? `<button onclick="setStatus(${r.id},'resolved')" class="rounded-lg bg-green-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-200">Mark resolved</button>`
      : '';
    return `<li class="rounded-xl bg-white p-4 shadow ${r.status === 'new' ? 'ring-2 ring-red-500' : ''}">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="text-3xl" aria-hidden="true">${t.icon}</div>
          <div>
            <p class="font-bold">${t.label} · ${r.brgy}</p>
            <p class="text-sm text-gray-600">${r.where}</p>
            <p class="mt-1 text-xs text-gray-500">${timeAgo(r.at)} · <a class="font-medium text-red-600 hover:underline" href="tel:${r.phone.replace(/\s/g, '')}">${r.phone}</a></p>
          </div>
        </div>
        <span class="shrink-0 rounded-full px-3 py-1 text-xs font-semibold ${s.cls}">${s.label}</span>
      </div>
      ${action ? `<div class="mt-3 flex justify-end">${action}</div>` : ''}
    </li>`;
  }).join('');
}

[fS, fT, fB].forEach(el => el.addEventListener('change', render));

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick(); setInterval(tick, 30000);
render(); setInterval(render, 60000);
</script>
</body>
</html>
