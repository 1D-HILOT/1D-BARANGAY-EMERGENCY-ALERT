<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood & Disaster (MDRRMO) - Emergency Response</title>
    <link rel="stylesheet" href="flood.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-wrapper">
        <!-- Top App Bar -->
        <header class="top-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Flood & Disaster (MDRRMO)</h2>
            <div class="header-placeholder"></div>
        </header>

        <!-- Main Content Scroll Area -->
        <main class="content-body">
            
            <!-- Location Banner -->
            <div class="location-banner">
                <i class="fa-solid fa-location-dot location-icon"></i>
                <div class="location-text">
                    <span class="label">Affected Location</span>
                    <strong>Brgy. Payompon, Mamburao</strong>
                </div>
                <button type="button" class="change-loc-btn">Change</button>
            </div>

            <!-- Emergency Form Card -->
            <div class="form-card">
                <div class="card-header">
                    <div class="emergency-icon-badge disaster-badge">
                        <i class="fa-solid fa-cloud-showers-heavy"></i>
                    </div>
                    <div>
                        <h3>Disaster & Rescue Support</h3>
                        <p>Municipal Disaster Risk Reduction Team</p>
                    </div>
                </div>

                <form action="#" method="POST">
                    
                    <!-- Severity Level Selector -->
                    <div class="input-group">
                        <label>Water Level / Hazard Impact</label>
                        <div class="severity-options">
                            <label class="severity-card critical">
                                <input type="radio" name="severity" value="evacuate" checked>
                                <div class="severity-content">
                                    <i class="fa-solid fa-house-flood-water"></i>
                                    <span>Chest High</span>
                                </div>
                            </label>
                            <label class="severity-card moderate">
                                <input type="radio" name="severity" value="rising">
                                <div class="severity-content">
                                    <i class="fa-solid fa-water"></i>
                                    <span>Knee High</span>
                                </div>
                            </label>
                            <label class="severity-card minor">
                                <input type="radio" name="severity" value="blocked">
                                <div class="severity-content">
                                    <i class="fa-solid fa-hill-rockslide"></i>
                                    <span>Landslide/Obstruction</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Type of Disaster -->
                    <div class="input-group">
                        <label for="disaster-type">Type of Hazard</label>
                        <div class="select-field">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <select id="disaster-type" required>
                                <option value="" disabled selected>Select hazard type</option>
                                <option value="flood">Flash Flood / Rising Water</option>
                                <option value="evacuation">Evacuation Assistance Needed</option>
                                <option value="landslide">Landslide / Soil Collapse</option>
                                <option value="tree">Fallen Tree / Structural Collapse</option>
                                <option value="typhoon">Storm Surge / Strong Winds Damage</option>
                            </select>
                        </div>
                    </div>

                    <!-- Number of Affected People -->
                    <div class="input-group">
                        <label for="people-count">People Needing Evacuation</label>
                        <div class="input-field">
                            <i class="fa-solid fa-users"></i>
                            <input type="number" id="people-count" min="1" value="1" required>
                        </div>
                    </div>

                    <!-- Additional Details -->
                    <div class="input-group">
                        <label for="notes">Immediate Rescue Needs</label>
                        <div class="textarea-field">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <textarea id="notes" rows="3" placeholder="Includes senior citizens, infants, pets, or special equipment needed..."></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="sos-dispatch-btn">
                        <i class="fa-solid fa-life-ring"></i> Request Rescue Boat / Team
                    </button>
                </form>
            </div>

            <!-- Hotline Box -->
            <div class="notice-box">
                <span class="notice-badge">MDRRMO HOTLINE</span>
                <p>Disaster Command Center: <strong>(043) 444-9111</strong></p>
            </div>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="hotlines.html" class="nav-item active">
                <i class="fa-solid fa-phone"></i>
                <span>Hotlines</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fa-solid fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

</body>
</html>
