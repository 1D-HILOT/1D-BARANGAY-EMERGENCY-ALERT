<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Assistance (PNP) - Emergency Response</title>
    <link rel="stylesheet" href="police.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-wrapper">
        <!-- Top App Bar -->
        <header class="top-header">
            <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Police Assistance</h2>
            <div class="header-placeholder"></div>
        </header>

        <!-- Main Content Scroll Area -->
        <main class="content-body">
            
            <!-- Location Banner -->
            <div class="location-banner">
                <i class="fa-solid fa-location-dot location-icon"></i>
                <div class="location-text">
                    <span class="label">Incident Location</span>
                    <strong>Brgy. Payompon, Mamburao</strong>
                </div>
                <button type="button" class="change-loc-btn">Change</button>
            </div>

            <!-- Emergency Form Card -->
            <div class="form-card">
                <div class="card-header">
                    <div class="emergency-icon-badge police-badge">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <h3>Request Police Unit</h3>
                        <p>Philippine National Police Dispatch</p>
                    </div>
                </div>

                <form action="#" method="POST">
                    
                    <!-- Urgency Level -->
                    <div class="input-group">
                        <label>Threat Level</label>
                        <div class="severity-options">
                            <label class="severity-card critical">
                                <input type="radio" name="severity" value="armed" checked>
                                <div class="severity-content">
                                    <i class="fa-solid fa-gun"></i>
                                    <span>Active Threat</span>
                                </div>
                            </label>
                            <label class="severity-card moderate">
                                <input type="radio" name="severity" value="crime">
                                <div class="severity-content">
                                    <i class="fa-solid fa-handcuffs"></i>
                                    <span>In Progress</span>
                                </div>
                            </label>
                            <label class="severity-card minor">
                                <input type="radio" name="severity" value="report">
                                <div class="severity-content">
                                    <i class="fa-solid fa-clipboard-list"></i>
                                    <span>Non-Urgent</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Type of Crime/Incident -->
                    <div class="input-group">
                        <label for="police-type">Nature of Incident</label>
                        <div class="select-field">
                            <i class="fa-solid fa-shield-cat"></i>
                            <select id="police-type" required>
                                <option value="" disabled selected>Select crime / assistance type</option>
                                <option value="robbery">Robbery / Theft in Progress</option>
                                <option value="assault">Physical Assault / Violence</option>
                                <option value="suspicious">Suspicious Activity / Person</option>
                                <option value="domestic">Domestic / Disturbance</option>
                                <option value="traffic">Traffic Accident / Dispute</option>
                                <option value="other">Other Police Support</option>
                            </select>
                        </div>
                    </div>

                    <!-- Suspect / Vehicle Description -->
                    <div class="input-group">
                        <label for="suspect-desc">Suspect / Vehicle Info (If any)</label>
                        <div class="input-field">
                            <i class="fa-solid fa-eye"></i>
                            <input type="text" id="suspect-desc" placeholder="Plate no., clothing color, direction of flight...">
                        </div>
                    </div>

                    <!-- Additional Details -->
                    <div class="input-group">
                        <label for="notes">Situation Description</label>
                        <div class="textarea-field">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <textarea id="notes" rows="3" placeholder="Describe what is happening right now..."></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="sos-dispatch-btn">
                        <i class="fa-solid fa-person-shelter"></i> Request Police Assistance
                    </button>
                </form>
            </div>

            <!-- Hotline Box -->
            <div class="notice-box">
                <span class="notice-badge">PNP HOTLINE</span>
                <p>Mamburao Station: <strong>(043) 555-0199</strong></p>
            </div>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="hotlines.html" class="nav-item active">
                <i class="fa-solid fa-phone"></i>
                <span>Hotlines</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fa-solid fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

</body>
</html>
